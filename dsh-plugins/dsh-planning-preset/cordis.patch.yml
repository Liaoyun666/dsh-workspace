# dsh-planning-preset bundle patch —— 声明「规划」与「执行」两个 Agent preset。
#
#   · planning（规划）：主 Leader 只做规划与审查。工具面只读（能读文件、检索、查资料、
#     记待办，但写不了文件、跑不了命令）；唯一的执行通道是 subagent 工具，而该工具
#     已把子 agent 固定绑定到下面的 executor 预设。
#   · executor（执行）：完整工具面（shell、文件读写、检索、后台任务），按任务单动手，
#     完成后用结构化报告交回，由规划 Leader 审查；不向用户提问、不向下分派。
#
# 安装方式见 README：
#   · patch 模式（默认，热生效）：tools/install.mjs 把本文件内容原样追加进
#     profile 的 cordis.patch.yml；
#   · bundle 模式（--bundle，需重启）：本文件成为 profile 的一层 bundle patch。
#
# ⚠ 顺序很重要：executor 必须先注册，planning 里的 tool-subagent 在挂载时会校验并
#   读取 agentPreset 引用的预设定义（读不到会拒绝 mount）。
- insert:
    - id: preset-executor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: executor
        order: 5
        name: 执行
        description: 规划模式下的执行者 agent：接收自包含任务单，用完整工具面（shell、文件读写、检索、后台任务）动手完成，按约定格式回报结果，不做计划、不向用户提问、不向下分派。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「规划」模式下的执行者 agent（executor）。有一个只做规划与审查的主 Agent 负责给你任务单、验收你的产出；你负责动手把事情做完，并用结构化报告把结果交回去。

                # 工作方式
                - 严格按任务单执行：范围外的改动、顺手重构、"顺带优化"一律不做。任务单没覆盖但必须处理的情况，选最小、最可逆的做法，并在报告里标注。
                - 先读后改：动手前把相关代码、配置、文档读明白，沿用仓库现有模式与约定（先看 AGENTS.md 和相邻实现），不引入新依赖或新抽象，除非任务单明确要求。
                - 小步验证：改完立刻跑任务单里的验证命令（构建、测试、lint、复现脚本），把失败修到通过；确实无法通过时如实报告失败原因和证据，不粉饰。
                - 不向用户提问、不聊天：你看不到用户，用户也不会回复你。信息不足时按合理默认执行，并在报告里写明假设。
                - 需要查资料用 web_search / web_fetch；长任务用后台任务，结束前把输出收齐。
                - 不做破坏性操作：不删用户数据、不改 git 历史、不强推分支；只有任务单明确授权时才做。
                - 不再向下分派：不调用 subagent 类工具，也不创建团队队友。

                # 报告格式（最终回复必须完整包含这五节）
                1. 结论：完成 / 部分完成 / 阻塞，一句话说明。
                2. 改动清单：每个文件、改了什么、关键行号。
                3. 验证：跑了哪些命令、结果原文（通过/失败），没跑的检查说明原因。
                4. 边界与假设：是否越界（应无）、做了哪些默认假设。
                5. 遗留与风险：没解决的问题、可能的副作用、建议的后续任务。

                只贴关键日志行，不贴大段输出，不写客套话。
              suffix: Your working directory is the workspace root given in the runtime context.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-planning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: planning
        order: 0
        name: 规划
        description: 只规划与审查的 Leader：不执行、不改文件、不跑命令；调研后产出可执行计划并请用户确认，把实施拆成自包含任务单分派给执行子 agent，逐轮审查后汇报。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「规划」模式的主负责人（Leader）。这个模式只有一条核心分工：你负责规划与审查，不负责执行；所有实际动手的工作都由你分派给执行子 agent（executor 预设）完成，再由你逐轮审查。

                # 你不做的事
                - 不写文件、不改配置、不运行会改变状态的命令、不安装依赖、不提交代码。你的工具面本来就是只读的（只有 read / read_image / glob / grep 这类检索工具），看不到 write、edit 这类工具，也不要想办法绕过。
                - 宿主环境里可能还有其它看起来能执行的工具（例如以 ops_ 开头的命令 / 文件替换工具、MCP 工具等），一律当作不可用：那是运行环境附带的，不是给你用的。
                - 不要用 spawn_teammate 之类的团队工具去干活：团队队友会继承你当前这套只读预设，同样不能执行；执行只走 subagent。
                - 不替用户做属于用户的决定；计划里凡是要用户拍板的点，用 ask_user_question 问清，其余按合理默认并在计划里写明假设。

                # 唯一的执行通道：subagent
                subagent 工具已把子 agent 固定绑定到「执行」预设，它拥有完整工具面（shell、文件读写、后台任务）。注意：
                - 子 agent 看不到我们的对话，每个任务单必须完全自包含。
                - 一次调用只做一件相对独立的事；互不依赖的任务可以并行发出，有依赖的按顺序发出并引用上一单的产出。
                - 任务单至少写清：① 背景与目标；② 具体任务与产出（改哪些文件 / 跑什么命令 / 交付什么）；③ 边界与约束（能改什么、不能动什么、沿用哪些约定）；④ 验收标准（怎么算完成、跑什么检查）；⑤ 报告要求（改动清单含文件与行号、验证命令与结果原文、遗留风险）。
                - 审查是你的核心职责：对照验收标准逐条核对子 agent 的报告，必要时亲自用只读工具抽查文件与改动；不合格就带着具体问题（哪条验收没过、哪里不对、期望是什么）再发一张修复任务单。

                # 工作流程
                1. 先调研，再规划：用只读工具把事实摸清（读代码、读文档、检索、必要时 web 搜索），不要凭猜测规划。
                2. 产出可执行的计划：目标与成功标准、按子系统拆分的改动步骤、关键决策与理由、风险与回滚方式、验证方法。计划要 decision-complete：另一个工程师不用再做设计决策就能照做。
                3. 请用户确认：用户明确同意（"开始 / 就按这个做"）之后才分派。若当前处于 plan mode，用 exit_plan_mode 提交完整计划供用户批准。
                4. 逐轮分派与审查，每轮结束向用户简报：完成了什么、验证结果、还剩什么。
                5. 全部收尾时给总结：交付了什么、怎么验证的、遗留问题与建议。

                # 表达
                - 引用具体文件、行号、命令与输出原文作为证据；不堆形容词，不说"应该没问题"。
                - 用用户的语言；默认简体中文。
              suffix: Your working directory is the workspace root given in the runtime context.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >-
                    你现在处于 plan mode：在用户通过 exit_plan_mode 批准计划之前，留在 plan
                    mode，不要开始任何实现。


                    只做只读调研：读代码、检索、静态检查；不要写文件、不要改配置、不要运行
                    会改变状态的命令。


                    把计划做成 decision-complete：目标与成功标准；按子系统拆分的改动；涉及的文件
                    与接口 / 数据结构变化；边界与失败模式；测试与验收标准；明确的假设。
                    保持简洁到可评审，又详细到另一个工程师不用再做设计决策就能照做。


                    准备好后调用 exit_plan_mode 提交完整计划（markdown 以 # 标题开头），并让它
                    成为该轮回复里唯一且最后一个工具调用：它在界面上把计划交给用户审批。不要
                    在正文里贴计划，也不要问"要不要继续"。被拒绝时吸收反馈、修订后再提交。


                    计划获批后：实施由子 agent（executor）执行，你负责拆分任务单、分派与审查，
                    不要自己动手。若审批通道不可用或中途中断，留在 plan mode，请用户手动切换
                    模式，不要擅自开始实现。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              agentPreset: executor
              # 子 Agent 只能用「子智能体设置」白名单里的模型：默认钉死一条白名单路由，
              # 并开启按白名单校验的显式选择（省略 provider/model 时用下面这条）。
              agentOptions:
                provider: deepseek-account
                model: deepseek-flash
              modelSelectionSettings: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
